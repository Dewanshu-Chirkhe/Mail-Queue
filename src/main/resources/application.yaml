spring:
  application:
    name: mailqueue

  datasource:
    url: jdbc:postgresql://localhost:5432/mailqueue
    username: mailqueue
    password: mailqueue

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

mailqueue:
  worker:
    threads: 5
    poll-interval: 1000
    lock-timeout: 60000